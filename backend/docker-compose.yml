services:
  postgres:
    image: postgres:18.7
    container_name: postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: cloudpulse_db
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - cloudpulse_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: cloudpulse-postgres-data

networks:
  cloudpulse_network:
    name: cloudpulse_network
    driver: bridge